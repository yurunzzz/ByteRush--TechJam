data_dir: kuairand-starter-kit
desc_file: null
preprocess_data: false
goal: null
eval: null
log_dir: logs_stage4
workspace_dir: workspaces_stage4
copy_data: false
exp_name: kuairand_stage4

exec:
  timeout: 1000
  # Multiprocessing spawn imports PyTorch before the child can signal ready.
  repl_startup_timeout: 60
  agent_file_name: runfile.py
  format_tb_ipython: false

generate_report: false
report:
  model: ${oc.env:AI_SCIENTIST_REPORT_MODEL,deepseek-v4-flash}
  temp: 0.2

experiment:
  num_syn_datasets: 1

debug:
  stage4: false

agent:
  type: parallel
  num_workers: 2
  max_workers_per_gpu: 2
  max_stage: 4
  stages:
    stage1_max_iters: 2
    stage2_max_iters: 2
    stage3_max_iters: 7
    stage4_max_iters: 3
  steps: 1
  k_fold_validation: 1
  multi_seed_eval:
    num_seeds: 3
  research_loop:
    enabled: true
    # This is a safety ceiling. Adaptive convergence normally stops earlier;
    # productive directions may use more rounds while gains remain positive.
    max_research_rounds: 1
    patience: 1
    stage1_validation_iterations: 2
    # Stage 1A remains the official FM control. Stage 1B creates cheap,
    # schema-v2-compatible non-FM roots. Stage 2 tunes the FM control and the
    # strongest root from each family under the same validation/seed protocol.
    stage1b_enabled: true
    stage1b_model_families:
      - mlp
      - wide_deep
      - dcn
    stage1b_generation_attempts: 6
    stage1b_max_epochs: 5
    frontier_max_size: 8
    baseline_tuning_iterations: 2
    stage2_num_seeds: 2
    # FM plus at most one validation-best root from each configured family.
    stage2_root_top_k: 4
    # A primary winner may not sacrifice either component by more than this.
    max_component_regression: 0.001
    # Five independent agents share the verified incumbent and choose their own science.
    candidate_branches: 5
    candidate_semantic_similarity_threshold: 0.80
    max_candidates_per_research_family: 2
    candidate_parallel_workers: 2
    # The stricter candidate contract needs two spare attempts beyond dbcab71.
    # Three first attempts plus two contract/debug retries.
    stage3_generation_attempts: 7
    min_valid_candidates_per_round: 3
    target_valid_candidates_per_round: 5
    max_repair_attempts_per_assignment: 2
    no_valid_round_patience: 2
    low_gain_round_patience: 3
    min_round_primary_gain: 0.0002
    smoke_test_enabled: true
    smoke_test_timeout_seconds: 240
    # Reuse the generation score for 3 -> 2 elimination. Top 2 get one
    # targeted correction; the fixed Top 1 gets most of the parameter budget.
    candidate_tuning_top_k: 2
    candidate_tuning_iterations: 1
    candidate_refinement_top_k: 1
    candidate_refinement_iterations: 1
    candidate_finalist_top_k: 1
    finalist_top_k: 1
    # Two screening seeds precede ablation; final confirmation uses five.
    finalist_num_seeds: 2
    # Feed the strongest diverse validation-only non-winners into the next
    # Stage 3 round as transferable lessons, never as automatic promotions.
    experience_top_k: 3
    # Preserve parallel Stage 3 execution while avoiding simultaneous
    # PyTorch/CUDA initialization spikes on the single competition GPU.
    stage3_startup_stagger_seconds: 8
    final_confirmation_num_seeds: 2
    ablation_candidate_top_k: 1
    ablation_synergy_pairs: 0
    provisional_min_primary_gain: 0.0005
    final_promotion_min_primary_gain: 0.001
    # A safety cutoff, not a runtime target. The loop stops earlier when
    # marginal validation value disappears and reserves finalization time.
    max_wall_clock_seconds: 19800
    finalize_reserve_seconds: 600
    checkpoint_submission_each_incumbent: true
    min_primary_gain: 0.002
    required_seed_wins: 1
  # Stage 4 entry requires both a promotable Stage 3 gain and a literal
  # ABLATION_COMPONENTS manifest in the winning code. Stage 4 runs controlled
  # leave-one-component-out ablations, then five-seed final confirmation before freezing.
  ablation:
    mode: registered_component_leave_one_out
    min_primary_gain: 0.002
    num_seeds: 1
    min_successful_seeds: 1
    max_components: 3
  final_model_dir: artifacts/comparison_current/final_model
  expose_prediction: false
  data_preview: false
  code:
    model: ${oc.env:AI_SCIENTIST_CODE_MODEL,deepseek-v4-pro}
    temp: 0.2
    max_tokens: 12000
  feedback:
    model: ${oc.env:AI_SCIENTIST_FEEDBACK_MODEL,deepseek-v4-flash}
    temp: 0.1
    max_tokens: 8192
  summary:
    model: ${oc.env:AI_SCIENTIST_SUMMARY_MODEL,deepseek-v4-flash}
    temp: 0.2
  select_node:
    model: ${oc.env:AI_SCIENTIST_SELECT_MODEL,deepseek-v4-flash}
    temp: 0.1
  vlm_feedback:
    model: ${oc.env:AI_SCIENTIST_VLM_MODEL,deepseek-v4-flash-vision-exp}
    temp: 0.1
    max_tokens: 8192
  search:
    max_debug_depth: 2
    debug_prob: 1.0
    num_drafts: 2

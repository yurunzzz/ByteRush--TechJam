data_dir: kuairand-starter-kit
desc_file: null
preprocess_data: false
goal: null
eval: null
log_dir: logs_stage4
workspace_dir: workspaces_stage4
copy_data: false
exp_name: kuairand_stage4

exec:
  timeout: 1000
  agent_file_name: runfile.py
  format_tb_ipython: false

generate_report: false
report:
  model: ${oc.env:AI_SCIENTIST_REPORT_MODEL,deepseek-v4-flash}
  temp: 0.2

experiment:
  num_syn_datasets: 1

debug:
  stage4: false

agent:
  type: parallel
  num_workers: 3
  max_workers_per_gpu: 3
  max_stage: 4
  stages:
    stage1_max_iters: 2
    stage2_max_iters: 24
    stage3_max_iters: 16
    stage4_max_iters: 9
  steps: 1
  k_fold_validation: 1
  multi_seed_eval:
    num_seeds: 3
  research_loop:
    enabled: true
    max_research_rounds: 4
    patience: 2
    stage1_validation_iterations: 2
    baseline_tuning_iterations: 24
    # Four research groups with two distinct mechanisms per group.
    candidate_branches: 8
    candidate_parallel_workers: 3
    # Allow one contract/execution repair attempt per requested leaf.
    stage3_generation_attempts: 16
    # All leaves receive coarse tuning; only the strongest three are refined.
    candidate_tuning_iterations: 8
    candidate_refinement_top_k: 3
    candidate_refinement_iterations: 12
    candidate_finalist_top_k: 2
    finalist_top_k: 3
    finalist_num_seeds: 3
    final_confirmation_num_seeds: 5
    ablation_candidate_top_k: 2
    ablation_synergy_pairs: 3
    min_primary_gain: 0.002
    required_seed_wins: 2
  # Stage 4 entry requires both a promotable Stage 3 gain and a literal
  # ABLATION_COMPONENTS manifest in the winning code. Stage 4 runs controlled
  # leave-one-component-out ablations and three-seed validation before freezing.
  ablation:
    mode: registered_component_leave_one_out
    min_primary_gain: 0.002
    num_seeds: 3
    min_successful_seeds: 3
    max_components: 6
  final_model_dir: artifacts/final_model
  expose_prediction: false
  data_preview: false
  code:
    model: ${oc.env:AI_SCIENTIST_CODE_MODEL,deepseek-v4-pro}
    temp: 0.2
    max_tokens: 12000
  feedback:
    model: ${oc.env:AI_SCIENTIST_FEEDBACK_MODEL,deepseek-v4-flash}
    temp: 0.1
    max_tokens: 8192
  summary:
    model: ${oc.env:AI_SCIENTIST_SUMMARY_MODEL,deepseek-v4-flash}
    temp: 0.2
  select_node:
    model: ${oc.env:AI_SCIENTIST_SELECT_MODEL,deepseek-v4-flash}
    temp: 0.1
  vlm_feedback:
    model: ${oc.env:AI_SCIENTIST_VLM_MODEL,deepseek-v4-flash-vision-exp}
    temp: 0.1
    max_tokens: 8192
  search:
    max_debug_depth: 2
    debug_prob: 1.0
    num_drafts: 2
